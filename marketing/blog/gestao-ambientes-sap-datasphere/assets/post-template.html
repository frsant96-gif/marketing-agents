<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@700;800&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1200px; height: 628px; overflow: hidden; background: #0A0E19; }

.ad { width: 1200px; height: 628px; position: relative; overflow: hidden; background: #0A0E19; }
.ad::after { content: ''; position: absolute; inset: 0; background-image: radial-gradient(circle, rgba(255,255,255,0.06) 1px, transparent 1px); background-size: 36px 36px; pointer-events: none; z-index: 1; }
.accent { position: absolute; left: 0; top: 0; width: 5px; height: 100%; background: #006AFF; z-index: 20; }

.content { position: absolute; left: 80px; top: 0; bottom: 76px; width: 520px; display: flex; flex-direction: column; justify-content: center; z-index: 10; }
.tag { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
.tag-line { width: 28px; height: 2px; background: #006AFF; }
.tag-text { font-family: 'Montserrat', Arial, sans-serif; font-size: 11px; font-weight: 600; color: #006AFF; text-transform: uppercase; letter-spacing: 0.14em; }
.headline { font-family: 'Prompt', 'Arial Black', sans-serif; font-size: 42px; font-weight: 800; color: #FFFFFF; line-height: 1.14; letter-spacing: -0.02em; margin-bottom: 22px; }
.headline em { font-style: normal; color: #006AFF; }
.subtext { font-family: 'Montserrat', Arial, sans-serif; font-size: 16px; font-weight: 400; color: rgba(255,255,255,0.6); line-height: 1.65; margin-bottom: 34px; max-width: 440px; }
.subtext b { color: #FFFFFF; font-weight: 600; }
.cta { display: inline-flex; align-items: center; gap: 10px; background: #006AFF; color: #FFFFFF; font-family: 'Montserrat', Arial, sans-serif; font-size: 15px; font-weight: 600; padding: 15px 28px; border-radius: 28px; width: fit-content; }

.visual { position: absolute; inset: 0; width: 1200px; height: 628px; z-index: 5; overflow: hidden; }
.visual img { width: 100%; height: 100%; object-fit: cover; object-position: 55% center; display: block; }

/* Blurred duplicate of the photo, cropped to the left zone reserved for text.
   Real gaussian blur of the actual pixels (not backdrop-filter) so it renders
   consistently in headless screenshots. */
.blur-crop {
  position: absolute;
  inset: 0;
  z-index: 7;
  overflow: hidden;
  clip-path: polygon(0 0, 640px 0, 640px 100%, 0 100%);
  -webkit-clip-path: polygon(0 0, 640px 0, 640px 100%, 0 100%);
}
.blur-crop img {
  position: absolute;
  top: -5%;
  left: -5%;
  width: 110%;
  height: 110%;
  object-fit: cover;
  object-position: 55% center;
  filter: blur(45px) saturate(0.9);
}
.blur-tint {
  position: absolute;
  inset: 0;
  z-index: 7;
  background: rgba(10, 14, 25, 0.8);
  clip-path: polygon(0 0, 640px 0, 640px 100%, 0 100%);
  -webkit-clip-path: polygon(0 0, 640px 0, 640px 100%, 0 100%);
}
/* soft feathered seam between blurred panel and sharp photo */
.blur-seam {
  position: absolute;
  left: 560px;
  top: 0;
  width: 160px;
  height: 100%;
  z-index: 8;
  background: linear-gradient(to right, rgba(10,14,25,0.8) 0%, rgba(10,14,25,0) 100%);
}

.bar { position: absolute; bottom: 0; left: 0; right: 0; height: 72px; background: rgba(255,255,255,0.028); border-top: 1px solid rgba(255,255,255,0.07); display: flex; align-items: center; justify-content: space-between; padding: 0 64px 0 80px; z-index: 20; }
.logo-img { height: 34px; display: block; }
.badge { display: flex; align-items: center; gap: 10px; }
.badge-icon { width: 34px; height: 34px; background: #006AFF; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-family: 'Prompt', sans-serif; font-size: 12px; font-weight: 800; color: white; }
.badge-label { font-family: 'Montserrat', sans-serif; font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 0.07em; line-height: 1.5; }
</style>
</head>
