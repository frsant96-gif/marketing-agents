<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Assinatura Solveplan</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@700&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
  <style>
    .sp-name { font-family: 'Prompt', Arial, sans-serif !important; }
    .sp-body { font-family: 'Montserrat', Arial, sans-serif !important; }
  </style>
</head>
<body style="margin: 0; padding: 40px; background: #f0f0f0;">

<!--
  ============================================================
  ASSINATURA SOLVEPLAN — TEMPLATE
  ============================================================

  COMO PERSONALIZAR (só mexer nos 4 campos abaixo):

  1. "Nome Sobrenome"       → seu nome completo
  2. "Cargo"                → seu cargo
  3. "email@solveplan.com"  → seu email corporativo
  4. "+55 (11) 99999-9999"  → seu telefone com DDD

  COMO INSERIR NO OUTLOOK (Microsoft 365):

  Passo 1 — Abra este arquivo no Chrome ou Edge
  Passo 2 — Selecione tudo: Ctrl + A
  Passo 3 — Copie: Ctrl + C
  Passo 4 — No Outlook: Arquivo → Opções → Email → Assinaturas → Nova
  Passo 5 — Cole: Ctrl + V na área de edição da assinatura
  Passo 6 — Dê um nome (ex: "Assinatura Solveplan") e clique em OK

  ============================================================
-->

<table cellpadding="0" cellspacing="0" border="0" width="560"
  style="font-family: Arial, Helvetica, sans-serif; max-width: 560px;">
  <tr>

    <!-- COLUNA ESQUERDA — Logo (não editar) -->
    <td width="160" bgcolor="#006AFF"
      style="background-color: #006AFF; padding: 24px 16px; text-align: center; vertical-align: middle;">
      <table cellpadding="0" cellspacing="0" border="0" align="center">
        <tr>
          <td width="110" bgcolor="#FFFFFF"
            style="background-color: #FFFFFF; border-radius: 55px; text-align: center; vertical-align: middle; padding: 15px; overflow: hidden;">
            <img
              src="https://47910417.fs1.hubspotusercontent-na1.net/hubfs/47910417/Logo%20500x500_.png"
              alt="solveplan"
              width="80"
              style="display: block; height: auto;" />
          </td>
        </tr>
      </table>
    </td>

    <!-- COLUNA DIREITA — Seus dados -->
    <td bgcolor="#0A0E19"
      style="background-color: #0A0E19; padding: 24px 28px; vertical-align: middle;">

      <!-- ▼ EDITAR: seu nome -->
      <p class="sp-name" style="margin: 0 0 3px 0; font-size: 17px; font-weight: 700; color: #FFFFFF; letter-spacing: 0.3px; font-family: 'Prompt', Arial, sans-serif;">
        Nome Sobrenome
      </p>

      <!-- ▼ EDITAR: seu cargo -->
      <p class="sp-body" style="margin: 0 0 16px 0; font-size: 12px; font-weight: 500; color: #94FF96; font-family: 'Montserrat', Arial, sans-serif;">
        Cargo
      </p>

      <!-- ▼ EDITAR: seu email -->
      <table cellpadding="0" cellspacing="0" border="0" style="margin-bottom: 8px;">
        <tr>
          <td width="28" height="28" style="vertical-align: middle;">
            <img src="https://47910417.fs1.hubspotusercontent-na1.net/hubfs/47910417/e-mail.png"
              alt="email" width="28" height="28" style="display: block;" />
          </td>
          <td class="sp-body" style="padding-left: 8px; font-size: 12px; vertical-align: middle; font-family: 'Montserrat', Arial, sans-serif;">
            <a href="mailto:email@solveplan.com"
              style="color: #FFFFFF; text-decoration: none; font-family: 'Montserrat', Arial, sans-serif;">email@solveplan.com</a>
          </td>
        </tr>
      </table>

      <!-- Site fixo — não editar -->
      <table cellpadding="0" cellspacing="0" border="0" style="margin-bottom: 8px;">
        <tr>
          <td width="28" height="28" style="vertical-align: middle;">
            <img src="https://47910417.fs1.hubspotusercontent-na1.net/hubfs/47910417/Website.png"
              alt="site" width="28" height="28" style="display: block;" />
          </td>
          <td class="sp-body" style="padding-left: 8px; font-size: 12px; vertical-align: middle; font-family: 'Montserrat', Arial, sans-serif;">
            <a href="https://www.solveplan.com"
              style="color: #FFFFFF; text-decoration: none; font-family: 'Montserrat', Arial, sans-serif;">www.solveplan.com</a>
          </td>
        </tr>
      </table>

      <!-- ▼ EDITAR: seu telefone -->
      <table cellpadding="0" cellspacing="0" border="0">
        <tr>
          <td width="28" height="28" style="vertical-align: middle;">
            <img src="https://47910417.fs1.hubspotusercontent-na1.net/hubfs/47910417/telefone1.png"
              alt="telefone" width="28" height="28" style="display: block;" />
          </td>
          <td class="sp-body" style="padding-left: 8px; color: #FFFFFF; font-size: 12px; vertical-align: middle; font-family: 'Montserrat', Arial, sans-serif;">
            +55 (11) 99999-9999
          </td>
        </tr>
      </table>

    </td>
  </tr>
</table>

</body>
</html>
