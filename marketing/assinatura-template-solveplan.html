<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Assinatura Solveplan</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@700&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
</head>
<body style="margin: 0; padding: 40px; background: #ffffff;">

<!--
  ============================================================
  ASSINATURA SOLVEPLAN — TEMPLATE
  ============================================================

  COMO PERSONALIZAR (só mexer nos 4 campos marcados com ▼):

  1. "Nome Sobrenome"       → seu nome completo
  2. "Cargo"                → seu cargo
  3. "email@solveplan.com"  → seu email corporativo
  4. "+55 (11) 99999-9999"  → seu telefone com DDD

  COMO INSERIR NO OUTLOOK (Microsoft 365):

  Passo 1 — Abra este arquivo no Chrome ou Edge
  Passo 2 — Selecione tudo: Ctrl + A
  Passo 3 — Copie: Ctrl + C
  Passo 4 — No Outlook: Arquivo → Opções → Email → Assinaturas → Nova
  Passo 5 — Cole: Ctrl + V na área de edição da assinatura
  Passo 6 — Dê um nome (ex: "Assinatura Solveplan") e clique em OK

  ============================================================
-->

<table cellpadding="0" cellspacing="0" border="0" width="520"
  style="font-family: Arial, Helvetica, sans-serif; max-width: 520px;">
  <tr>

    <!-- COLUNA ESQUERDA — Logo -->
    <td width="110" style="padding: 0 20px 0 0; text-align: center; vertical-align: middle;">
      <img
        src="https://47910417.fs1.hubspotusercontent-na1.net/hubfs/47910417/Logo%20500x500_.png"
        alt="solveplan"
        width="100"
        style="display: block; height: auto;" />
    </td>

    <!-- ESPAÇO -->
    <td width="24" style="padding: 0;"></td>

    <!-- COLUNA DIREITA — Dados -->
    <td style="padding: 8px 0 8px 24px; vertical-align: middle;">

      <!-- ▼ EDITAR: seu nome -->
      <p style="margin: 0 0 2px 0; font-size: 16px; font-weight: 700; color: #0A0837;
                font-family: 'Prompt', Arial, sans-serif; letter-spacing: 0.2px;">
        Nome Sobrenome
      </p>

      <!-- ▼ EDITAR: seu cargo -->
      <p style="margin: 0 0 14px 0; font-size: 12px; font-weight: 500; color: #006AFF;
                font-family: 'Montserrat', Arial, sans-serif;">
        Cargo
      </p>

      <!-- ▼ EDITAR: seu email -->
      <table cellpadding="0" cellspacing="0" border="0" style="margin-bottom: 6px;">
        <tr>
          <td width="26" height="26" style="vertical-align: middle;">
            <img src="https://47910417.fs1.hubspotusercontent-na1.net/hubfs/47910417/e-mail.png"
              alt="" width="26" height="26" style="display: block;" />
          </td>
          <td style="padding-left: 8px; font-size: 12px; vertical-align: middle;
                     font-family: 'Montserrat', Arial, sans-serif;">
            <a href="mailto:email@solveplan.com"
              style="color: #0A0837; text-decoration: none;
                     font-family: 'Montserrat', Arial, sans-serif;">email@solveplan.com</a>
          </td>
        </tr>
      </table>

      <!-- Site — não editar -->
      <table cellpadding="0" cellspacing="0" border="0" style="margin-bottom: 6px;">
        <tr>
          <td width="26" height="26" style="vertical-align: middle;">
            <img src="https://47910417.fs1.hubspotusercontent-na1.net/hubfs/47910417/Website.png"
              alt="" width="26" height="26" style="display: block;" />
          </td>
          <td style="padding-left: 8px; font-size: 12px; vertical-align: middle;
                     font-family: 'Montserrat', Arial, sans-serif;">
            <a href="https://www.solveplan.com"
              style="color: #0A0837; text-decoration: none;
                     font-family: 'Montserrat', Arial, sans-serif;">www.solveplan.com</a>
          </td>
        </tr>
      </table>

      <!-- ▼ EDITAR: seu telefone -->
      <table cellpadding="0" cellspacing="0" border="0">
        <tr>
          <td width="26" height="26" style="vertical-align: middle;">
            <img src="https://47910417.fs1.hubspotusercontent-na1.net/hubfs/47910417/telefone1.png"
              alt="" width="26" height="26" style="display: block;" />
          </td>
          <td style="padding-left: 8px; color: #0A0837; font-size: 12px; vertical-align: middle;
                     font-family: 'Montserrat', Arial, sans-serif;">
            +55 (11) 99999-9999
          </td>
        </tr>
      </table>

      <!-- REDES SOCIAIS — substituir os href pelos links reais de cada perfil -->
      <table cellpadding="0" cellspacing="0" border="0" style="margin-top: 14px;">
        <tr>
          <td style="padding-right: 8px;">
            <a href="https://www.linkedin.com/company/solveplan" target="_blank" style="text-decoration: none;">
              <img src="https://47910417.fs1.hubspotusercontent-na1.net/hubfs/47910417/Linkedin.png"
                alt="LinkedIn" width="28" height="28" style="display: block;" />
            </a>
          </td>
          <td style="padding-right: 8px;">
            <a href="https://www.youtube.com/@solveplan" target="_blank" style="text-decoration: none;">
              <img src="https://47910417.fs1.hubspotusercontent-na1.net/hubfs/47910417/Youtube.png"
                alt="YouTube" width="28" height="28" style="display: block;" />
            </a>
          </td>
          <td style="padding-right: 8px;">
            <a href="https://www.instagram.com/solveplan" target="_blank" style="text-decoration: none;">
              <img src="https://47910417.fs1.hubspotusercontent-na1.net/hubfs/47910417/Instagram.png"
                alt="Instagram" width="28" height="28" style="display: block;" />
            </a>
          </td>
          <td>
            <a href="https://www.facebook.com/solveplan" target="_blank" style="text-decoration: none;">
              <img src="https://47910417.fs1.hubspotusercontent-na1.net/hubfs/47910417/Facebook.png"
                alt="Facebook" width="28" height="28" style="display: block;" />
            </a>
          </td>
        </tr>
      </table>

    </td>
  </tr>
</table>

</body>
</html>
