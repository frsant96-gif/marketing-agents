<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Slide 1/2</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700;800&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1350px; overflow:hidden; }
  body {
    font-family:'Montserrat', sans-serif;
    background: radial-gradient(ellipse at 78% 30%, #101a38 0%, #0A0E19 55%, #060810 100%);
    color:#FFFFFF;
    position:relative;
    width:1080px; height:1350px;
  }

  .tag {
    position:absolute; top:56px; left:56px;
    background:#006AFF;
    color:#fff;
    font-family:'Prompt', sans-serif;
    font-weight:800;
    font-size:30px;
    padding:10px 30px;
    border-radius:8px;
    letter-spacing:0.5px;
    z-index:5;
  }

  .content {
    position:absolute;
    top:170px; left:64px; right:64px;
    z-index:4;
  }

  h1 {
    font-family:'Prompt', sans-serif;
    font-weight:800;
    font-size:62px;
    line-height:1.14;
    color:#FFFFFF;
    max-width:900px;
  }
  h1 .blue { color:#4DA3FF; }

  .divider {
    width:110px; height:4px;
    background:#006AFF;
    margin:32px 0 30px 0;
    border-radius:2px;
  }

  p.lead {
    font-size:28px;
    line-height:1.55;
    color:#D7DDEA;
    max-width:800px;
    font-weight:500;
  }
  p.lead .blue { color:#4DA3FF; font-weight:700; }

  /* Illustration container */
  .illustration {
    position:absolute;
    top:730px; left:60px;
    width:960px; height:520px;
    z-index:2;
  }

  .illustration svg.lines { position:absolute; top:0; left:0; width:960px; height:520px; }

  .icon-box {
    position:absolute;
    width:92px; height:92px;
    border-radius:16px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 10px 26px rgba(0,0,0,0.4);
    z-index:3;
  }
  .icon-excel { background:#1D7245; top:10px; left:0px; }
  .icon-folder { background:#293A5C; top:120px; left:70px; }
  .icon-db { background:#161F35; top:230px; left:130px; border:2px solid #2E3C5E; }
  .icon-sap-tag { background:#0B2C6F; top:340px; left:190px; width:100px; }

  .ia-circle {
    position:absolute;
    right:70px; top:110px;
    width:300px; height:300px;
    border-radius:50%;
    background:radial-gradient(circle at 50% 45%, rgba(0,106,255,0.30), rgba(10,14,25,0.02) 70%);
    border:3px solid #4DA3FF;
    box-shadow: 0 0 70px 12px rgba(0,106,255,0.45), inset 0 0 45px rgba(77,163,255,0.30);
    display:flex; align-items:center; justify-content:center;
    z-index:3;
  }
  .ia-circle span {
    font-family:'Prompt', sans-serif;
    font-weight:800;
    font-size:68px;
    color:#FFFFFF;
    text-shadow:0 0 22px rgba(77,163,255,0.9);
  }

  .footer {
    position:absolute;
    bottom:60px; left:64px;
    z-index:5;
  }
  .footer .brand {
    font-family:'Prompt', sans-serif;
    font-weight:800;
    font-size:32px;
    color:#FFFFFF;
    display:flex; align-items:center; gap:8px;
  }
  .footer .brand .dot { color:#006AFF; }
  .footer .sub {
    font-size:16px;
    color:#8996B3;
    margin-top:4px;
    font-weight:500;
    letter-spacing:0.5px;
  }
</style>
</head>
<body>

  <div class="tag">1/2</div>

  <div class="content">
    <h1>IA não corrige<br><span class="blue">dado bagunçado.</span></h1>
    <div class="divider"></div>
    <p class="lead">
      Se os dados ainda estão espalhados entre SAP,
      planilhas e sistemas que não se falam,
      <span class="blue">o problema começa antes da inteligência artificial.</span>
    </p>
  </div>

  <div class="illustration">
    <svg class="lines" viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="3.5" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>
      <path d="M46,56 C350,90 620,150 740,260" stroke="#4DA3FF" stroke-width="1.4" fill="none" opacity="0.55" filter="url(#glow)"/>
      <path d="M116,166 C380,210 620,230 740,260" stroke="#4DA3FF" stroke-width="1.4" fill="none" opacity="0.5" filter="url(#glow)"/>
      <path d="M176,276 C420,290 620,280 740,260" stroke="#4DA3FF" stroke-width="1.4" fill="none" opacity="0.5" filter="url(#glow)"/>
      <path d="M240,386 C450,360 620,300 740,260" stroke="#4DA3FF" stroke-width="1.4" fill="none" opacity="0.55" filter="url(#glow)"/>
    </svg>

    <!-- Excel icon -->
    <div class="icon-box icon-excel">
      <svg width="46" height="46" viewBox="0 0 24 24" fill="none">
        <path d="M7 6l10 12M17 6L7 18" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"/>
      </svg>
    </div>

    <!-- Folder icon -->
    <div class="icon-box icon-folder">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none">
        <path d="M3 6.5C3 5.67 3.67 5 4.5 5H9l2 2h8.5c.83 0 1.5.67 1.5 1.5v9c0 .83-.67 1.5-1.5 1.5h-15C3.67 19 3 18.33 3 17.5v-11z" fill="#D8DEEC"/>
      </svg>
    </div>

    <!-- Database icon -->
    <div class="icon-box icon-db">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none">
        <ellipse cx="12" cy="5.5" rx="8" ry="3" fill="#4DA3FF"/>
        <path d="M4 5.5v13c0 1.66 3.58 3 8 3s8-1.34 8-3v-13" stroke="#4DA3FF" stroke-width="1.6" fill="none"/>
        <path d="M4 11c0 1.66 3.58 3 8 3s8-1.34 8-3" stroke="#4DA3FF" stroke-width="1.6" fill="none"/>
      </svg>
    </div>

    <!-- SAP tag icon -->
    <div class="icon-box icon-sap-tag">
      <span style="font-family:'Prompt', sans-serif; font-weight:800; font-size:20px; color:#FFFFFF;">SAP</span>
    </div>

    <div class="ia-circle"><span>IA</span></div>
  </div>

  <div class="footer">
    <div class="brand">solveplan<span class="dot">■</span></div>
    <div class="sub"></div>
  </div>
  <div style="position:absolute; bottom:34px; left:64px; font-size:16px; color:#8996B3; font-weight:500; z-index:5;">business intelligence</div>

</body>
</html>
